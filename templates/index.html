<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>📩 AI Spam Detector</h1>

<form method="POST">

<textarea name="message"
placeholder="Enter your message..."
required></textarea>

<button type="submit">Check Message</button>

</form>

{% if result %}
<h2>Result: {{ result }}</h2>
{% endif %}

</div>

</body>
</html>
